services:
  front:
    build:
      context: ./front
    ports:
      - "3000:3000"
    volumes:
      - ./front:/app
      - node_modules:/app/node_modules
    tty: true
    stdin_open: true
    depends_on:
      - back
  back:
    build:
      context: ./back
    tty: true
    env_file:
      - back/.env
    depends_on:
      - mysql
      - redis
      - mail
    volumes:
      - ./back:/devport
    ports:
      - "5050:5050"
  batch:
    build:
      context: ./batch
    tty: true
    env_file:
      - back/.env
    volumes:
      - ./batch:/devport
    ports:
      - "5051:5051"
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devport
      TZ: "Asia/Tokyo"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD" ]
      interval: 30s
      timeout: 5s
      retries: 6
  mail:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mail_data:/data
  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:RELEASE.2023-11-11T08-14-41Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data
volumes:
  node_modules:
  db_data:
  mail_data:
  minio_data:
